<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>목표 트래커</title>
<meta name="theme-color" content="#17437d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="목표">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== 디자인 토큰 ===================== */
:root{
  --brand:#17437d; --brand-mid:#3a6fa8; --brand-light:#c3d9f3;
  --bg:#f8f8f7; --surface:#ffffff; --surface2:#f2f3f5;
  --border:#e8e7e3; --text:#2d2926; --text2:#717170; --text3:#aaa9a7;
  --r:12px; --r-lg:16px; --r-sm:8px;
  --shadow:0 1px 2px rgba(45,41,38,.04), 0 4px 14px rgba(45,41,38,.06);
  --shadow-lg:0 -8px 40px rgba(45,41,38,.16);
  --tabbar-h:62px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'Inter','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--brand-mid);box-shadow:0 0 0 3px rgba(58,111,168,.16);background:var(--surface)}
::-webkit-scrollbar{width:0;height:0}

/* ===================== 공통 ===================== */
.accent{height:4px;background:linear-gradient(90deg,#BFDDF0,#A7C1A8,#FBC3C1,#EBD6FB,#FFE99A);flex:none}
.hidden{display:none!important}
.muted{color:var(--text2)}
.tiny{font-size:12px}

/* ===================== 로그인 ===================== */
#login{
  min-height:100dvh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:28px 24px calc(28px + var(--sab));
  background:var(--bg);
}
.login-card{width:100%;max-width:360px;text-align:center}
.login-logo{width:76px;height:76px;border-radius:20px;box-shadow:var(--shadow);margin:0 auto 20px;display:block}
.login-title{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
.login-sub{color:var(--text2);font-size:14px;margin:0 0 22px;line-height:1.55}
.login-accent{height:4px;width:76px;margin:0 auto 26px;border-radius:2px;
  background:linear-gradient(90deg,#BFDDF0,#A7C1A8,#FBC3C1,#EBD6FB,#FFE99A)}
.gwrap{width:100%;margin-bottom:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.gbtn{
  width:100%;height:52px;border-radius:999px;background:var(--surface);
  border:1px solid var(--border); box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-weight:600;font-size:15px;
}
.gbtn:active{transform:scale(.985)}
#gisBtn{min-height:44px;display:flex;justify-content:center;width:100%}
#gisBtn>div{margin:0 auto}
.login-note{font-size:12.5px;color:var(--text3);line-height:1.6;margin-top:6px}
.linkbtn{color:var(--brand-mid);font-size:12.5px;text-decoration:underline;margin-top:14px;display:inline-block}
.setup{
  margin-top:24px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:16px;text-align:left;box-shadow:var(--shadow)
}
.setup h4{margin:0 0 8px;font-size:13.5px}
.setup p{margin:0 0 10px;font-size:12.5px;color:var(--text2);line-height:1.6}
.setup input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface2)}
.setup button{margin-top:10px;width:100%;padding:11px;border-radius:var(--r-sm);background:var(--brand);color:#fff;font-weight:600;font-size:14px}

/* ===================== 셸 ===================== */
#app{display:none;flex-direction:column;min-height:100dvh}
#app.on{display:flex}
.topbar{
  background:var(--brand);color:#fff;padding:calc(var(--sat) + 12px) 16px 12px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:40;
}
.topbar h1{font-size:16.5px;font-weight:700;margin:0;letter-spacing:-.01em}
.me{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);
  border-radius:999px;padding:4px 11px 4px 4px;max-width:150px}
.me img,.me .av{width:26px;height:26px;border-radius:50%;flex:none;object-fit:cover;
  background:var(--brand-mid);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.me span{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{
  position:absolute;right:14px;top:calc(var(--sat) + 54px);background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);
  padding:6px;min-width:210px;z-index:60
}
.menu .em{padding:9px 11px;font-size:12.5px;color:var(--text2);word-break:break-all;border-bottom:1px solid var(--border);margin-bottom:4px}
.menu button{width:100%;text-align:left;padding:10px 11px;border-radius:var(--r-sm);font-size:14px;font-weight:500}
.menu button:active{background:var(--surface2)}

main{flex:1;padding:16px 16px calc(var(--tabbar-h) + var(--sab) + 24px);max-width:560px;width:100%;margin:0 auto}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:var(--sab);
}
.tabbar button{
  height:var(--tabbar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text3);font-size:11px;font-weight:600;position:relative;
}
.tabbar button svg{width:21px;height:21px}
.tabbar button.on{color:var(--brand)}
.tabbar button.on::after{content:'';position:absolute;bottom:9px;width:18px;height:2.5px;border-radius:2px;background:var(--brand)}

/* ===================== 요소 ===================== */
.page-h{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.page-h h2{font-size:19px;font-weight:700;margin:0;letter-spacing:-.02em}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px}
.stepper button{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:16px}
.stepper button:active{background:var(--surface2)}
.stepper .val{font-size:13.5px;font-weight:600;padding:0 6px;min-width:52px;text-align:center}

.months{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-behavior:smooth}
.months button{
  flex:none;padding:8px 15px;border-radius:999px;background:var(--surface);
  border:1px solid var(--border);font-size:13.5px;font-weight:600;color:var(--text2)
}
.months button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.months button.has::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--brand-light);margin-right:6px;vertical-align:middle}
.months button.on.has::before{background:rgba(255,255,255,.7)}

.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.card .bar{height:4px}
.card .body{padding:14px}

.seg{display:flex;background:var(--surface2);border-radius:999px;padding:3px;margin-bottom:16px}
.seg button{flex:1;padding:9px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--text2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(45,41,38,.1)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--text2)}
.chip.brand{background:var(--brand-light);color:var(--brand)}
.chip.done{background:#e4f0e4;color:#4b7a4e}
.chip.now{background:var(--brand);color:#fff}

.check{
  width:30px;height:30px;border-radius:50%;flex:none;border:2px solid var(--border);
  background:var(--surface);display:flex;align-items:center;justify-content:center;transition:.15s
}
.check svg{width:16px;height:16px;opacity:0;transform:scale(.6);transition:.15s}
.check.on{border-color:transparent}
.check.on svg{opacity:1;transform:scale(1)}
.check:active{transform:scale(.9)}

.iconbtn{width:30px;height:30px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--text3)}
.iconbtn:active{background:var(--surface2);color:var(--text2)}
.iconbtn svg{width:16px;height:16px}

.progress{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:9px}
.progress i{display:block;height:100%;border-radius:3px;transition:width .3s}

.addbtn{
  width:100%;padding:14px;border-radius:var(--r);border:1.5px dashed var(--border);
  color:var(--text2);font-weight:600;font-size:14px;background:var(--surface);margin-top:2px
}
.addbtn:active{background:var(--surface2)}

.empty{text-align:center;padding:44px 20px;color:var(--text3);font-size:13.5px;line-height:1.7}
.empty b{display:block;color:var(--text2);font-size:15px;font-weight:600;margin-bottom:6px}

.banner{
  background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);
  padding:13px 15px;margin-bottom:14px;display:flex;align-items:center;gap:10px
}
.banner .d{font-size:14.5px;font-weight:700}
.banner .w{margin-left:auto}

.wrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--border)}
.wrow:first-child{border-top:0}
.wtag{font-size:11px;font-weight:700;color:var(--text3);width:20px;flex:none}
.wname{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wname.empty-name{color:var(--text3)}

.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:linear-gradient(135deg,var(--brand),var(--brand-mid));color:#fff;border-radius:var(--r);padding:16px 14px}
.stat .n{font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat .l{font-size:12px;opacity:.82;margin-top:3px}

.cal{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.cal .dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.cal .dow span{text-align:center;font-size:11px;font-weight:600;color:var(--text3)}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cell{aspect-ratio:1;border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--text2)}
.cell.pad{visibility:hidden}
.cell.today{background:var(--surface2);font-weight:700;color:var(--text)}
.cell.sel{background:var(--brand);color:#fff;font-weight:700}
.cell .dots{display:flex;gap:2px;height:5px;align-items:center}
.cell .dots i{width:5px;height:5px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:2px 2px 4px}
.legend div{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.legend i{width:9px;height:9px;border-radius:3px}

.logbox{margin-top:11px;border-top:1px solid var(--border);padding-top:11px}
.logline{display:flex;gap:8px;align-items:flex-start;padding:7px 0}
.logline p{margin:0;flex:1;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.logline .dt{font-size:11px;color:var(--text3);flex:none;width:38px;padding-top:2px}
.loginput{display:flex;gap:7px;margin-top:8px}
.loginput textarea{
  flex:1;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;
  background:var(--surface2);resize:none;font-size:14px;line-height:1.5;min-height:38px;max-height:120px
}
.loginput button{padding:0 14px;border-radius:var(--r-sm);background:var(--brand);color:#fff;font-weight:600;font-size:13.5px;flex:none}

.note-prev{margin-top:9px;background:var(--surface2);border-radius:var(--r-sm);padding:9px 11px;font-size:12.5px;color:var(--text2);line-height:1.55;white-space:pre-wrap}

/* ===================== 모달 ===================== */
.backdrop{position:fixed;inset:0;background:rgba(45,41,38,.36);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(26px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet{
  width:100%;max-width:560px;background:var(--surface);
  border-radius:20px 20px 0 0;overflow:hidden;animation:rise .22s cubic-bezier(.2,.8,.3,1);
  max-height:90dvh;display:flex;flex-direction:column
}
.sheet .accent{border-radius:20px 20px 0 0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 4px}
.sheet-h h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.sheet-b{padding:14px 18px 18px;overflow-y:auto}
.sheet-b label{display:block;font-size:12.5px;font-weight:600;color:var(--text2);margin:16px 0 7px}
.sheet-b>label:first-child{margin-top:0}
.f{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface2)}
textarea.f{resize:none;min-height:82px;line-height:1.6}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.swatches button{width:36px;height:36px;border-radius:11px;border:2.5px solid transparent;transition:.12s}
.swatches button.on{border-color:var(--brand);transform:scale(1.06)}
.rowline{display:flex;align-items:center;gap:10px}
.rowline .f{flex:1}
.num{display:flex;align-items:center;gap:0;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm)}
.num button{width:40px;height:44px;font-size:18px;color:var(--text2)}
.num span{width:44px;text-align:center;font-weight:700;font-size:15px}
.switch{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:var(--r-sm);padding:12px 13px}
.switch .t{font-size:14px;font-weight:500}
.toggle{width:46px;height:27px;border-radius:999px;background:var(--border);position:relative;transition:.18s;flex:none}
.toggle i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--brand)}
.toggle.on i{left:22px}
.sheet-f{display:flex;gap:9px;margin-top:22px}
.btn{flex:1;padding:14px;border-radius:var(--r);font-weight:600;font-size:15px;text-align:center}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--text2)}
.btn.danger{background:#fdeceb;color:#c0392b;flex:none;width:52px;display:flex;align-items:center;justify-content:center}
.btn.danger svg{width:18px;height:18px}
.btn:active{opacity:.82}

#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + var(--sab) + 18px);
  background:var(--text);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:500;
  z-index:200;opacity:0;pointer-events:none;transition:.22s;max-width:88%;text-align:center
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}

#splash{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:300}
.spin{width:26px;height:26px;border:2.5px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="splash"><div class="spin"></div></div>

<!-- ===================== 로그인 ===================== -->
<section id="login" class="hidden">
  <div class="login-card">
    <img src="icon-192.png" alt="" class="login-logo">
    <h1 class="login-title">목표 트래커</h1>
    <p class="login-sub">나만의 목표를 설정하고<br>달성 여부를 시각적으로 확인하세요</p>
    <div class="login-accent"></div>

    <div class="gwrap" id="gwrap">
      <div id="gisBtn"></div>
      <button class="gbtn hidden" id="gbtnVisual">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.2-2.2H12v4.1h6.6c-.1 1.1-.9 2.8-2.5 3.9l3.8 3c2.3-2.1 3.6-5.2 3.6-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.8-3c-1 .7-2.4 1.2-4.2 1.2-3.2 0-5.9-2.1-6.9-5l-3.9 3C3.2 21.3 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.1 14.3c-.3-.8-.4-1.5-.4-2.3s.2-1.6.4-2.3l-4-3.1C.4 8.2 0 10 0 12s.4 3.8 1.1 5.4l4-3.1z"/><path fill="#EA4335" d="M12 4.8c2.3 0 3.8.9 4.7 1.7l3.4-3.3C18 1.2 15.2 0 12 0 7.3 0 3.2 2.7 1.1 6.6l4 3.1C6.1 6.8 8.8 4.8 12 4.8z"/></svg>
        Google로 시작하기
      </button>
    </div>

    <p class="login-note">로그인하면 어떤 기기에서든<br>데이터가 자동으로 동기화돼요</p>
    <a class="linkbtn" id="fallbackLogin" href="#">팝업이 안 열리면 여기를 눌러 로그인</a>

    <div class="setup hidden" id="setupBox">
      <h4>Google 클라이언트 ID를 입력해 주세요</h4>
      <p>Google Cloud Console &gt; 사용자 인증 정보에서 <b>웹 애플리케이션</b> 클라이언트 ID를 복사해 붙여넣으세요. (…apps.googleusercontent.com)</p>
      <input id="cidInput" placeholder="000000-xxxxx.apps.googleusercontent.com" autocomplete="off">
      <button id="cidSave">저장하고 로그인 준비</button>
    </div>
  </div>
</section>

<!-- ===================== 앱 ===================== -->
<div id="app">
  <header class="topbar">
    <h1>목표 트래커</h1>
    <button class="me" id="meBtn"></button>
  </header>
  <div class="accent"></div>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="year"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="9"/></svg>연간</button>
    <button data-tab="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>월간설정</button>
    <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M21 12a9 9 0 11-5.6-8.3"/></svg>오늘체크</button>
    <button data-tab="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><rect x="5" y="10" width="4" height="8" rx="1"/><rect x="14" y="5" width="4" height="13" rx="1"/></svg>리뷰</button>
  </nav>
</div>

<div id="toast"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ============================================================
   목표 트래커 — 앱 로직
   ============================================================ */
'use strict';

const CFG = window.APP_CONFIG || {};

/* ---------- 날짜 유틸 ---------- */
function p2(n){ return String(n).padStart(2,'0'); }
function ds(d){ return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function mk(d){ return d.getFullYear()+'-'+p2(d.getMonth()+1); }
function parseD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function daysInMonth(key){ const [y,m]=key.split('-').map(Number); return new Date(y,m,0).getDate(); }
const TODAY = ds(today);

/** 월요일 기준, 그 달의 W1~W4 구간. 5주차 이후는 W4에 포함된다. */
function weekSpans(key){
  const [y,m] = key.split('-').map(Number);
  const first = new Date(y,m-1,1);
  const last  = new Date(y,m,0);
  const fm    = mondayOf(first);
  const out=[];
  for(let i=0;i<4;i++){
    const st = addDays(fm, i*7);
    let en = addDays(st,6);
    if(i===3 && en < last) en = last;      // 5·6주차를 W4로 흡수
    out.push({ start:st, end:en });
  }
  return out;
}
/** 그 날짜가 속한 주차(1~4) */
function weekIndex(d){
  const spans = weekSpans(mk(d));
  const t = new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  for(let i=0;i<4;i++){
    if(t >= spans[i].start.getTime() && t <= spans[i].end.getTime()) return i+1;
  }
  return t < spans[0].start.getTime() ? 1 : 4;
}
function inSpan(dateStr, span){
  const t = parseD(dateStr).getTime();
  return t >= span.start.getTime() && t <= span.end.getTime();
}

/* ============================================================
   인증
   ============================================================ */
async function sha256hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

let gisTries = 0;
async function initGoogleButton(){
  if(!CLIENT_ID){
    $('#setupBox').classList.remove('hidden');
    $('#gwrap').classList.add('hidden');
    return;
  }
  if(!window.google || !google.accounts || !google.accounts.id){
    if(++gisTries > 25){                       // GIS 로드 실패 → 리다이렉트 방식으로 대체
      $('#gbtnVisual').classList.remove('hidden');
      return;
    }
    setTimeout(initGoogleButton, 300); return;
  }

  const rawNonce = crypto.randomUUID() + crypto.randomUUID();
  const hashed = await sha256hex(rawNonce);

  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    nonce: hashed,
    ux_mode: 'popup',
    auto_select: false,
    itp_support: true,
    callback: async (res) => {
      try{
        $('#splash').classList.remove('hidden');
        const { error } = await sb.auth.signInWithIdToken({
          provider:'google', token:res.credential, nonce:rawNonce
        });
        if(error) throw error;
        await boot();
      }catch(e){
        $('#splash').classList.add('hidden');
        toast('로그인 실패: ' + (e.message||e));
      }
    }
  });

  const wrap = $('#gwrap');
  google.accounts.id.renderButton($('#gisBtn'), {
    type:'standard', theme:'outline', size:'large', shape:'pill',
    text:'signin_with', logo_alignment:'center',
    width: Math.min(400, Math.round(wrap.getBoundingClientRect().width))
  });
}

async function loadAll(){
  const uid = S.user.id;
  const [y,m,w,c,l] = await Promise.all([
    sb.from('year_goals').select('*').eq('user_id',uid).order('sort_order').order('created_at'),
    sb.from('monthly_goals').select('*').eq('user_id',uid).order('sort_order').order('created_at'),
    sb.from('weekly_goals').select('*').eq('user_id',uid).order('sort_order'),
    sb.from('goal_checks').select('*').eq('user_id',uid),
    sb.from('goal_logs').select('*').eq('user_id',uid).order('created_at',{ascending:false})
  ]);
  const err = [y,m,w,c,l].find(r=>r.error);
  if(err){ toast('데이터를 불러오지 못했어요: '+err.error.message); }
  S.D.years    = y.data||[];
  S.D.months   = m.data||[];
  S.D.weeklies = w.data||[];
  S.D.checks   = c.data||[];
  S.D.logs     = l.data||[];
}

async function db(op){
  const { data, error } = await op;
  if(error){ toast('저장 실패: '+error.message); throw error; }
  return data;
}

/* 조회 헬퍼 */
const monthsOf   = key => S.D.months.filter(g=>g.month_key===key);
const weeksOf    = gid => S.D.weeklies.filter(w=>w.monthly_goal_id===gid).sort((a,b)=>a.sort_order-b.sort_order);
const isChecked  = (gid,date) => S.D.checks.some(c=>c.goal_id===gid && c.checked_date===date);
const checksOf   = gid => S.D.checks.filter(c=>c.goal_id===gid);
const logsOf     = gid => S.D.logs.filter(l=>l.goal_id===gid).sort((a,b)=> (b.log_date+b.created_at).localeCompare(a.log_date+a.created_at));

function monthTarget(g){
  if(g.goal_type==='project') return weeksOf(g.id).filter(w=>w.name && w.name.trim()).length || 4;
  if(g.repeat_unit==='day')   return daysInMonth(g.month_key);
  return (g.repeat_count||1) * 4;
}
function monthDone(g){
  if(g.goal_type==='project'){
    const ids = weeksOf(g.id).map(w=>w.id);
    return new Set(S.D.checks.filter(c=>ids.includes(c.goal_id)).map(c=>c.goal_id)).size;
  }
  return checksOf(g.id).filter(c=>c.checked_date.startsWith(g.month_key)).length;
}

/* ---------- 월 선택 pill ---------- */
function monthPills(){
  const [y] = S.monthKey.split('-').map(Number);
  let h = `<div class="page-h"><h2>${S.monthKey.split('-')[1]*1}월 목표</h2>
    <div class="stepper">
      <button data-act="my-" aria-label="이전 해">‹</button>
      <span class="val">${y}년</span>
      <button data-act="my+" aria-label="다음 해">›</button>
    </div></div><div class="months">`;
  for(let m=1;m<=12;m++){
    const key = y+'-'+p2(m);
    const has = S.D.months.some(g=>g.month_key===key);
    h += `<button class="${key===S.monthKey?'on':''} ${has?'has':''}" data-act="mset" data-key="${key}">${m}월</button>`;
  }
  return h + '</div>';
}

/* ---------- ② 월간설정 ---------- */
function viewMonth(){
  const list = monthsOf(S.monthKey);
  const wi = mk(today)===S.monthKey ? weekIndex(today) : 0;
  let h = monthPills();

  if(!list.length){
    h += `<div class="empty"><b>${S.monthKey.split('-')[1]*1}월 목표가 없어요</b>반복형은 습관을, 프로젝트형은<br>주차별로 나뉜 일을 추적해요</div>`;
  }

  list.forEach(g=>{
    const target = monthTarget(g), dn = monthDone(g);
    h += `<div class="card"><div class="bar" style="background:${g.color}"></div><div class="body">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-size:15.5px;font-weight:700;letter-spacing:-.01em">${esc(g.name)}</div>
          <div style="margin-top:5px;display:flex;gap:5px;align-items:center;flex-wrap:wrap">
            <span class="chip">${g.goal_type==='project'?'프로젝트형':'반복형'}</span>
            ${g.goal_type==='repeat'?`<span class="chip">${g.repeat_unit==='day'?'매일':'주 '+g.repeat_count+'회'}</span>`:''}
            ${g.log_type==='memo'?`<span class="chip">기록</span>`:''}
          </div>
        </div>
        ${g.goal_type==='project'?`<button class="iconbtn" data-act="gcollapse" data-id="${g.id}">${g.collapsed?'▾':'▴'}</button>`:''}
        <button class="iconbtn" data-act="gedit" data-id="${g.id}">${PEN}</button>
        <button class="iconbtn" data-act="gdel"  data-id="${g.id}">${TRASH}</button>
      </div>`;

    if(g.goal_type==='repeat'){
      h += `<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px">
              <span class="tiny muted">이번 달 달성</span>
              <span style="font-size:13px;font-weight:700">${dn} / ${target}${g.repeat_unit==='day'?'일':'회'}</span>
            </div>
            <div class="progress"><i style="width:${Math.min(100, target? dn/target*100:0)}%;background:${g.color}"></i></div>`;
    }else if(!g.collapsed){
      const ws = weeksOf(g.id);
      h += `<div style="margin-top:10px">`;
      for(let i=0;i<4;i++){
        const w = ws[i];
        const checked = w ? checksOf(w.id).length>0 : false;
        h += `<div class="wrow">
          <span class="wtag">W${i+1}</span>
          <button class="check ${checked?'on':''}" style="width:22px;height:22px;${checked?'background:'+g.color+';':''}" data-act="wtoggle" data-id="${w?w.id:''}" data-gid="${g.id}" data-idx="${i}">${CHECK_SVG}</button>
          <span class="wname ${w&&w.name?'':'empty-name'}">${w&&w.name?esc(w.name):'세부 목표 없음'}</span>
          ${wi===i+1?'<span class="chip now">이번 주</span>':''}
          <button class="iconbtn" data-act="wedit" data-gid="${g.id}" data-idx="${i}">${PEN}</button>
          <button class="iconbtn" data-act="wnote" data-gid="${g.id}" data-idx="${i}" style="${w&&w.note?'color:var(--brand-mid)':''}">${NOTE}</button>
          <button class="iconbtn" data-act="wclear" data-gid="${g.id}" data-idx="${i}">${XMARK}</button>
        </div>`;
      }
      h += `</div>`;
    }
    h += `</div></div>`;
  });

  h += `<button class="addbtn" data-act="gadd">+ ${S.monthKey.split('-')[1]*1}월 목표 추가</button>`;
  return h;
}

/* ---------- ③ 오늘체크 ---------- */
function viewToday(){
  const key = mk(today), wi = weekIndex(today);
  const list = monthsOf(key);
  const spans = weekSpans(key), span = spans[wi-1];

  let h = `<div class="banner">
      <div>
        <div class="d">${today.getMonth()+1}월 ${today.getDate()}일 ${DOW_FULL[today.getDay()]}</div>
        <div class="tiny muted" style="margin-top:2px">${today.getMonth()+1}월 ${wi}주차 · ${span.start.getMonth()+1}/${span.start.getDate()}~${span.end.getMonth()+1}/${span.end.getDate()}</div>
      </div>
      <span class="chip brand w">W${wi}</span>
    </div>`;

  if(!list.length){
    return h + `<div class="empty"><b>이번 달 목표가 아직 없어요</b>월간설정 탭에서 목표를 추가하면<br>여기에서 하루하루 체크할 수 있어요</div>`;
  }

  list.forEach(g=>{
    if(g.goal_type==='repeat'){
      const on = isChecked(g.id, TODAY);
      const wkDone = checksOf(g.id).filter(c=>inSpan(c.checked_date, span)).length;
      const goal = g.repeat_unit==='day' ? 1 : (g.repeat_count||1);
      h += `<div class="card"><div class="bar" style="background:${g.color}"></div>
        <div class="body" style="${on?'background:'+g.color+'2e':''}">
          <div style="display:flex;align-items:center;gap:11px">
            <button class="check ${on?'on':''}" style="${on?'background:'+g.color+';':''}" data-act="rtoggle" data-id="${g.id}">${CHECK_SVG}</button>
            <div style="flex:1;min-width:0">
              <div style="font-size:15.5px;font-weight:600;${on?'':''}">${esc(g.name)}</div>
              <div class="tiny muted" style="margin-top:3px">${g.repeat_unit==='day'?'매일':'주 '+goal+'회'} · 이번 주 ${wkDone}${g.repeat_unit==='day'?'일':'/'+goal+'회'}</div>
            </div>
          </div>
          ${logBlock(g)}
        </div></div>`;
    } else {
      const ws = weeksOf(g.id), w = ws[wi-1];
      if(!w || !w.name){
        h += `<div class="card"><div class="bar" style="background:${g.color}"></div><div class="body">
          <div style="font-size:15.5px;font-weight:600">${esc(g.name)}</div>
          <div class="tiny muted" style="margin-top:4px">W${wi} 세부 목표가 비어 있어요 · 월간설정에서 추가</div>
        </div></div>`;
        return;
      }
      const doneThisWeek = checksOf(w.id).some(c=>inSpan(c.checked_date, span));
      if(doneThisWeek){
        h += `<div class="card"><div class="bar" style="background:${g.color}"></div>
          <div class="body" style="background:${g.color}2e;display:flex;align-items:center;gap:11px">
            <button class="check on" style="background:${g.color}" data-act="wuncheck" data-id="${w.id}">${CHECK_SVG}</button>
            <div style="flex:1;min-width:0">
              <div style="font-size:14px;font-weight:700">이번 주 완료 · W${wi}</div>
              <div class="tiny muted" style="margin-top:2px">${esc(g.name)} — ${esc(w.name)}</div>
            </div>
          </div></div>`;
      }else{
        h += `<div class="card"><div class="bar" style="background:${g.color}"></div><div class="body">
          <div style="display:flex;align-items:center;gap:11px">
            <button class="check" data-act="wcheck" data-id="${w.id}">${CHECK_SVG}</button>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                <span style="font-size:15.5px;font-weight:600">${esc(g.name)}</span>
                <span class="chip now">이번 주 W${wi}</span>
              </div>
              <div class="tiny muted" style="margin-top:3px">${esc(w.name)}</div>
            </div>
          </div>
          ${w.note?`<div class="note-prev">${esc(w.note)}</div>`:''}
          ${logBlock(g)}
        </div></div>`;
      }
    }
  });
  return h;
}

function logBlock(g){
  if(g.log_type!=='memo') return '';
  const all = logsOf(g.id);
  const mine = all.filter(l=>l.log_date===TODAY);
  const prev = all.filter(l=>l.log_date!==TODAY).slice(0,2);
  const open = !!S.openLogs[g.id];
  let h = `<button class="chip" style="margin-top:11px" data-act="logtoggle" data-id="${g.id}">
             실행 기록 ${all.length} ${open?'▴':'▾'}</button>`;
  if(!open) return h;
  h += `<div class="logbox">`;
  if(mine.length){
    mine.forEach(l=>{
      h += `<div class="logline">
        <span class="dt">오늘</span><p>${esc(l.memo)}</p>
        <button class="iconbtn" data-act="logedit" data-id="${l.id}">${PEN}</button>
        <button class="iconbtn" data-act="logdel"  data-id="${l.id}">${TRASH}</button>
      </div>`;
    });
  }
  h += `<div class="loginput">
      <textarea rows="1" placeholder="오늘의 실행 기록" data-logfor="${g.id}"></textarea>
      <button data-act="logadd" data-id="${g.id}">기록</button>
    </div>`;
  if(prev.length){
    h += `<div class="tiny muted" style="margin:12px 0 2px">이전 기록</div>`;
    prev.forEach(l=>{
      const d = parseD(l.log_date);
      h += `<div class="logline"><span class="dt">${d.getMonth()+1}/${d.getDate()}</span><p style="color:var(--text2)">${esc(l.memo)}</p></div>`;
    });
  }
  return h + `</div>`;
}

/* ---------- ④ 리뷰 ---------- */
function viewReview(){
  let h = monthPills().replace('월 목표</h2>','월 리뷰</h2>');
  h += `<div class="seg">
      <button class="${S.reviewSeg==='week'?'on':''}"  data-act="seg" data-v="week">주간 현황</button>
      <button class="${S.reviewSeg==='month'?'on':''}" data-act="seg" data-v="month">월간 요약</button>
    </div>`;
  return h + (S.reviewSeg==='week' ? reviewWeek() : reviewMonth());
}

function reviewWeek(){
  const list = monthsOf(S.monthKey);
  if(!list.length) return `<div class="empty"><b>표시할 목표가 없어요</b>월간설정 탭에서 목표를 먼저 추가해 주세요</div>`;
  const spans = weekSpans(S.monthKey);
  const cur = mk(today)===S.monthKey ? weekIndex(today) : 0;
  let h = '';

  list.forEach(g=>{
    h += `<div class="card"><div class="bar" style="background:${g.color}"></div><div class="body">
      <div style="font-size:15px;font-weight:700;margin-bottom:10px">${esc(g.name)}</div>`;
    if(g.goal_type==='project'){
      const ws = weeksOf(g.id);
      for(let i=0;i<4;i++){
        const w = ws[i];
        const done = w ? checksOf(w.id).length>0 : false;
        const state = done ? ['완료','done'] : (cur===i+1 ? ['진행중','now'] : (cur>i+1 ? ['미완료',''] : ['예정','']));
        h += `<div class="wrow" style="${cur===i+1?'background:'+g.color+'22;border-radius:8px;padding-left:8px;padding-right:8px':''}">
            <span class="wtag" style="${cur===i+1?'color:var(--brand)':''}">W${i+1}</span>
            <span class="wname ${w&&w.name?'':'empty-name'}">${w&&w.name?esc(w.name):'—'}</span>
            <span class="chip ${state[1]}">${state[0]}</span>
          </div>`;
      }
    }else{
      const goal = g.repeat_unit==='day' ? 7 : (g.repeat_count||1);
      for(let i=0;i<4;i++){
        const n = checksOf(g.id).filter(c=>inSpan(c.checked_date, spans[i])).length;
        const pct = Math.min(100, goal? n/goal*100 : 0);
        h += `<div class="wrow" style="${cur===i+1?'background:'+g.color+'22;border-radius:8px;padding-left:8px;padding-right:8px':''}">
            <span class="wtag" style="${cur===i+1?'color:var(--brand)':''}">W${i+1}</span>
            <div style="flex:1">
              <div class="progress" style="margin-top:0"><i style="width:${pct}%;background:${g.color}"></i></div>
            </div>
            <span class="tiny" style="font-weight:700;min-width:44px;text-align:right">${n}/${goal}${g.repeat_unit==='day'?'일':'회'}</span>
          </div>`;
      }
    }
    h += `</div></div>`;
  });
  return h;
}

function reviewMonth(){
  const list = monthsOf(S.monthKey);
  if(!list.length) return `<div class="empty"><b>표시할 목표가 없어요</b>월간설정 탭에서 목표를 먼저 추가해 주세요</div>`;

  // 달성률
  let tgt=0, dn=0;
  list.forEach(g=>{ tgt += monthTarget(g); dn += monthDone(g); });
  const rate = tgt ? Math.round(dn/tgt*100) : 0;

  // 날짜별 색상
  const idsOf = g => g.goal_type==='project' ? weeksOf(g.id).map(w=>w.id) : [g.id];
  const byDate = {};
  list.forEach(g=>{
    idsOf(g).forEach(id=>{
      S.D.checks.filter(c=>c.goal_id===id && c.checked_date.startsWith(S.monthKey)).forEach(c=>{
        (byDate[c.checked_date] ||= []).push({color:g.color, name:g.name, gid:g.id});
      });
    });
  });
  const doneDays = Object.keys(byDate).length;

  const [y,m] = S.monthKey.split('-').map(Number);
  const dim = daysInMonth(S.monthKey);
  const pad = (new Date(y,m-1,1).getDay()+6)%7;

  let cells = '';
  for(let i=0;i<pad;i++) cells += `<div class="cell pad"></div>`;
  for(let d=1;d<=dim;d++){
    const key = `${y}-${p2(m)}-${p2(d)}`;
    const items = byDate[key]||[];
    const dots = items.slice(0,4).map(i=>`<i style="background:${i.color}"></i>`).join('');
    cells += `<div class="cell ${key===TODAY?'today':''} ${key===S.selDay?'sel':''}" data-act="day" data-d="${key}">
        <span>${d}</span><span class="dots">${dots}</span></div>`;
  }

  let detail = '';
  if(S.selDay){
    const items = byDate[S.selDay]||[];
    const sd = parseD(S.selDay);
    detail = `<div class="card"><div class="body">
      <div style="font-size:14.5px;font-weight:700;margin-bottom:9px">${sd.getMonth()+1}월 ${sd.getDate()}일 ${DOW_FULL[sd.getDay()]}</div>`;
    if(!items.length){
      detail += `<div class="tiny muted">이 날은 달성한 목표가 없어요</div>`;
    }else{
      const seen = new Set();
      items.forEach(it=>{
        if(seen.has(it.gid)) return; seen.add(it.gid);
        const g = list.find(x=>x.id===it.gid);
        const wname = g.goal_type==='project'
          ? (weeksOf(g.id).find(w=>S.D.checks.some(c=>c.goal_id===w.id && c.checked_date===S.selDay))||{}).name : '';
        detail += `<div style="display:flex;align-items:center;gap:8px;padding:6px 0">
            <i style="width:9px;height:9px;border-radius:3px;background:${it.color};flex:none"></i>
            <span style="font-size:13.5px;font-weight:600">${esc(it.name)}</span>
            ${wname?`<span class="tiny muted">${esc(wname)}</span>`:''}
          </div>`;
        const lg = logsOf(g.id).filter(l=>l.log_date===S.selDay);
        lg.forEach(l=>{ detail += `<div class="note-prev" style="margin:2px 0 6px 17px">${esc(l.memo)}</div>`; });
      });
    }
    detail += `</div></div>`;
  }

  return `
    <div class="statgrid">
      <div class="stat"><div class="n">${rate}%</div><div class="l">이번 달 달성률</div></div>
      <div class="stat"><div class="n">${doneDays}일</div><div class="l">달성한 날</div></div>
    </div>
    <div class="cal">
      <div class="dow">${DOW.map(d=>`<span>${d}</span>`).join('')}</div>
      <div class="grid">${cells}</div>
    </div>
    ${detail}
    <div class="legend">${list.map(g=>`<div><i style="background:${g.color}"></i>${esc(g.name)}</div>`).join('')}</div>`;
}

let sheetEl = null;
function openSheet(title, body, onMount){
  closeSheet();
  const el = document.createElement('div');
  el.className = 'backdrop';
  el.innerHTML = `<div class="sheet"><div class="accent"></div>
      <div class="sheet-h"><h3>${esc(title)}</h3>
        <button class="iconbtn" data-close>${XMARK}</button></div>
      <div class="sheet-b">${body}</div></div>`;
  el.addEventListener('click', e=>{ if(e.target===el || e.target.closest('[data-close]')) closeSheet(); });
  document.body.appendChild(el);
  sheetEl = el;
  if(onMount) onMount(el);
  const f = el.querySelector('input,textarea'); if(f) setTimeout(()=>f.focus(),120);
}
function closeSheet(){ if(sheetEl){ sheetEl.remove(); sheetEl=null; } }

/* ---------- 연간 목표 편집 ---------- */
function editYearGoal(g){
  openSheet(g? '연간 목표 수정':'연간 목표 추가', `
    <label>목표</label>
    <input class="f" id="ytext" value="${esc(g?.text||'')}" placeholder="올해 이루고 싶은 것">
    <label>메모</label>
    <textarea class="f" id="ynote" placeholder="왜 하고 싶은지, 어떻게 할지">${esc(g?.note||'')}</textarea>
    <div class="sheet-f">
      <button class="btn ghost" data-close>취소</button>
      <button class="btn primary" id="ysave">저장</button>
    </div>`, el=>{
    el.querySelector('#ysave').onclick = async ()=>{
      const text = el.querySelector('#ytext').value.trim();
      const note = el.querySelector('#ynote').value.trim();
      if(!text){ toast('목표를 입력해 주세요'); return; }

/* ---------- 월간 목표 편집 ---------- */
function editMonthGoal(g){

  const st = {
    name:g?.name||'', type:g?.goal_type||'repeat', color:g?.color||GOAL_COLORS[S.D.months.length%10],
    unit:g?.repeat_unit||'week', count:g?.repeat_count||3, log:(g?.log_type||'none')==='memo',
    ws: g ? [0,1,2,3].map(i=>weeksOf(g.id)[i]?.name||'') : ['','','','']
  };
  openSheet(isNew? `${S.monthKey.split('-')[1]*1}월 목표 추가`:'월간 목표 수정', `
    <label>목표 이름</label>
    <input class="f" id="gname" value="${esc(st.name)}" placeholder="예) 운동하기 / 코칭 수업 등록">

    <div class="seg" id="gtype" style="margin-bottom:0">
      <button data-v="repeat"  class="${st.type==='repeat'?'on':''}">반복형</button>
      <button data-v="project" class="${st.type==='project'?'on':''}">프로젝트형</button>
    </div>
    <p class="tiny muted" id="typehint" style="margin:8px 2px 0"></p>

    <div id="repeatBox">
      <label>반복 주기</label>
      <div class="rowline">
        <div class="seg" id="gunit" style="margin:0;flex:1">
          <button data-v="day"  class="${st.unit==='day'?'on':''}">매일</button>
          <button data-v="week" class="${st.unit==='week'?'on':''}">주 N회</button>
        </div>
        <div class="num" id="gnum" style="${st.unit==='day'?'display:none':''}">
          <button data-d="-1">−</button><span id="gcount">${st.count}</span><button data-d="1">+</button>
        </div>
      </div>
    </div>

    <div id="projBox">
      <label>주차별 세부 목표</label>
      ${[0,1,2,3].map(i=>`<div class="rowline" style="margin-bottom:8px">
          <span class="wtag" style="width:24px">W${i+1}</span>
          <input class="f" data-w="${i}" value="${esc(st.ws[i])}" placeholder="${['알아보기','등록하기','시작하기','마무리'][i]}">
        </div>`).join('')}
    </div>

    <label>색상</label>
    <div class="swatches" id="gcolor">
      ${GOAL_COLORS.map(c=>`<button data-c="${c}" class="${c===st.color?'on':''}" style="background:${c}"></button>`).join('')}
    </div>

    <label>실행 기록</label>
    <div class="switch"><span class="t">체크할 때 메모 남기기</span>
      <div class="toggle ${st.log?'on':''}" id="glog"><i></i></div></div>

    <div class="sheet-f">
      ${g?`<button class="btn danger" id="gdelete">${TRASH}</button>`:''}
      <button class="btn ghost" data-close>취소</button>
      <button class="btn primary" id="gsave">저장</button>
    </div>`, el=>{

    const sync = ()=>{
      el.querySelector('#repeatBox').style.display = st.type==='repeat'?'':'none';
      el.querySelector('#projBox').style.display   = st.type==='project'?'':'none';
      el.querySelector('#typehint').textContent = st.type==='repeat'
        ? '매일 또는 주 N회 — 오늘체크에서 원클릭으로 체크해요'
        : 'W1~W4가 그 달의 각 주차에 자동으로 매핑돼요';
      el.querySelector('#gnum').style.display = st.unit==='day'?'none':'';
    };
    sync();

    el.querySelector('#gtype').onclick = e=>{ const b=e.target.closest('button'); if(!b)return;
      st.type=b.dataset.v; el.querySelectorAll('#gtype button').forEach(x=>x.classList.toggle('on',x===b)); sync(); };
    el.querySelector('#gunit').onclick = e=>{ const b=e.target.closest('button'); if(!b)return;
      st.unit=b.dataset.v; el.querySelectorAll('#gunit button').forEach(x=>x.classList.toggle('on',x===b)); sync(); };
    el.querySelector('#gnum').onclick = e=>{ const b=e.target.closest('button'); if(!b)return;
      st.count=Math.max(1,Math.min(7,st.count+ +b.dataset.d)); el.querySelector('#gcount').textContent=st.count; };
    el.querySelector('#gcolor').onclick = e=>{ const b=e.target.closest('button'); if(!b)return;
      st.color=b.dataset.c; el.querySelectorAll('#gcolor button').forEach(x=>x.classList.toggle('on',x===b)); };
    el.querySelector('#glog').onclick = e=>{ st.log=!st.log; e.currentTarget.classList.toggle('on',st.log); };

    if(g) el.querySelector('#gdelete').onclick = ()=>{ closeSheet(); deleteMonthGoal(g); };

    el.querySelector('#gsave').onclick = async ()=>{
      const name = el.querySelector('#gname').value.trim();
      if(!name){ toast('목표 이름을 입력해 주세요'); return; }
      const ws = [...el.querySelectorAll('#projBox input')].map(i=>i.value.trim());
      const payload = { name, goal_type:st.type, color:st.color,
        log_type: st.log?'memo':'none',
        repeat_unit: st.type==='repeat'? st.unit : null,
        repeat_count: st.type==='repeat' && st.unit==='week' ? st.count : null };

      let goal = g;
      if(g){
        await db(sb.from('monthly_goals').update(payload).eq('id',g.id));
        Object.assign(g, payload);
      }else{
        goal = await db(sb.from('monthly_goals').insert({
          ...payload, user_id:S.user.id, month_key:S.monthKey, collapsed:false,
          sort_order: monthsOf(S.monthKey).length
        }).select().single());
        S.D.months.push(goal);
      }

      if(st.type==='project'){
        const cur = weeksOf(goal.id);
        for(let i=0;i<4;i++){
          const ex = cur[i];
          if(ex){
            if(ex.name !== ws[i]){
              await db(sb.from('weekly_goals').update({name:ws[i]}).eq('id',ex.id));
              ex.name = ws[i];
            }
          }else{
            const row = await db(sb.from('weekly_goals').insert({
              monthly_goal_id:goal.id, user_id:S.user.id, name:ws[i], note:'', sort_order:i
            }).select().single());
            S.D.weeklies.push(row);
          }
        }
      }
      closeSheet(); render();
    };
  });
}

async function deleteMonthGoal(g){
  if(!confirm(`'${g.name}' 목표를 삭제할까요?\n체크 기록도 함께 지워집니다.`)) return;
  const ids = [g.id, ...weeksOf(g.id).map(w=>w.id)];
  await db(sb.from('monthly_goals').delete().eq('id',g.id));
  await sb.from('goal_checks').delete().in('goal_id', ids);
  await sb.from('goal_logs').delete().in('goal_id', ids);
  S.D.months   = S.D.months.filter(x=>x.id!==g.id);
  S.D.weeklies = S.D.weeklies.filter(x=>x.monthly_goal_id!==g.id);
  S.D.checks   = S.D.checks.filter(c=>!ids.includes(c.goal_id));
  S.D.logs     = S.D.logs.filter(l=>!ids.includes(l.goal_id));
  render();
}

/* ---------- 주차 세부목표 편집 / 계획 메모 ---------- */
async function ensureWeekly(gid, idx){
  let w = weeksOf(gid)[idx];
  if(w) return w;
  // 빈 자리를 메꿔가며 생성
  for(let i=0;i<=idx;i++){
    if(!weeksOf(gid)[i]){
      const row = await db(sb.from('weekly_goals').insert({
        monthly_goal_id:gid, user_id:S.user.id, name:'', note:'', sort_order:i
      }).select().single());
      S.D.weeklies.push(row);
    }
  }
  return weeksOf(gid)[idx];
}

function editWeekly(gid, idx, mode){
  const w = weeksOf(gid)[idx];
  const isNote = mode==='note';
  openSheet(`W${idx+1} ${isNote?'계획 메모':'세부 목표'}`, `
    <label>${isNote?'계획 메모':`W${idx+1} 세부 목표`}</label>
    ${isNote
      ? `<textarea class="f" id="wv" placeholder="이 주차에 무엇을 어떻게 할지">${esc(w?.note||'')}</textarea>`
      : `<input class="f" id="wv" value="${esc(w?.name||'')}" placeholder="예) 수업 알아보기">`}
    <div class="sheet-f">
      <button class="btn ghost" data-close>취소</button>
      <button class="btn primary" id="wsave">저장</button>
    </div>`, el=>{
    el.querySelector('#wsave').onclick = async ()=>{
      const v = el.querySelector('#wv').value.trim();
      const row = await ensureWeekly(gid, idx);
      const patch = isNote ? {note:v} : {name:v};
      await db(sb.from('weekly_goals').update(patch).eq('id', row.id));
      Object.assign(row, patch);
      closeSheet(); render();
    };
  });
}

/* ============================================================
   체크 / 기록 액션
   ============================================================ */
async function toggleCheck(goalId, goalType, date){
  const ex = S.D.checks.find(c=>c.goal_id===goalId && c.checked_date===date);
  if(ex){
    await db(sb.from('goal_checks').delete().eq('id', ex.id));
    S.D.checks = S.D.checks.filter(c=>c.id!==ex.id);
  }else{
    const row = await db(sb.from('goal_checks').insert({
      user_id:S.user.id, goal_id:goalId, goal_type:goalType, checked_date:date
    }).select().single());
    S.D.checks.push(row);
  }
  render();
}
async function clearWeekChecks(weeklyId){
  const ids = checksOf(weeklyId).map(c=>c.id);
  if(!ids.length) return;
  await db(sb.from('goal_checks').delete().in('id', ids));
  S.D.checks = S.D.checks.filter(c=>!ids.includes(c.id));
  render();
}

/* ============================================================
   이벤트 위임
   ============================================================ */
document.addEventListener('click', async (e)=>{
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const a = t.dataset.act, id = t.dataset.id, gid = t.dataset.gid, idx = +t.dataset.idx;

  try{
    switch(a){
      /* 연간 */
      case 'year-': S.year--; render(); break;
      case 'year+': S.year++; render(); break;
      case 'yadd':  editYearGoal(null); break;
      case 'yedit': editYearGoal(S.D.years.find(g=>g.id===id)); break;
      case 'ytoggle': {
        const g = S.D.years.find(x=>x.id===id);
        await db(sb.from('year_goals').update({done:!g.done}).eq('id',id));
        g.done=!g.done; render(); break;
      }
      case 'ydel': {
        const g = S.D.years.find(x=>x.id===id);
        if(!confirm(`'${g.text}' 를 삭제할까요?`)) break;
        await db(sb.from('year_goals').delete().eq('id',id));
        S.D.years = S.D.years.filter(x=>x.id!==id); render(); break;
      }

      /* 월 선택 */
      case 'mset': S.monthKey = t.dataset.key; S.selDay=null; render(); break;
      case 'my-': case 'my+': {
        const [y,m] = S.monthKey.split('-').map(Number);
        S.monthKey = (y + (a==='my+'?1:-1)) + '-' + p2(m); S.selDay=null; render(); break;
      }

      /* 월간 목표 */
      case 'gadd':  editMonthGoal(null); break;
      case 'gedit': editMonthGoal(S.D.months.find(g=>g.id===id)); break;
      case 'gdel':  deleteMonthGoal(S.D.months.find(g=>g.id===id)); break;
      case 'gcollapse': {
        const g = S.D.months.find(x=>x.id===id);
        await db(sb.from('monthly_goals').update({collapsed:!g.collapsed}).eq('id',id));
        g.collapsed=!g.collapsed; render(); break;
      }
      case 'wedit': editWeekly(gid, idx, 'name'); break;
      case 'wnote': editWeekly(gid, idx, 'note'); break;
      case 'wclear': {
        const w = weeksOf(gid)[idx];
        if(!w || (!w.name && !w.note)) break;
        if(!confirm(`W${idx+1} 세부 목표를 비울까요?`)) break;
        await db(sb.from('weekly_goals').update({name:'',note:''}).eq('id',w.id));
        Object.assign(w,{name:'',note:''});
        await clearWeekChecks(w.id); render(); break;
      }
      case 'wtoggle': {
        if(!id){ toast('먼저 세부 목표를 입력해 주세요'); break; }
        if(checksOf(id).length){ await clearWeekChecks(id); break; }
        const w = S.D.weeklies.find(x=>x.id===id);
        const spans = weekSpans(S.monthKey);
        const span = spans[w.sort_order] || spans[3];
        const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const date = (t >= span.start && t <= span.end) ? ds(t) : ds(span.start);
        await toggleCheck(id, 'weekly', date);
        break;
      }

      /* 오늘체크 */
      case 'rtoggle':  await toggleCheck(id,'repeat', TODAY); break;
      case 'wcheck':   await toggleCheck(id,'weekly', TODAY); break;
      case 'wuncheck': await clearWeekChecks(id); break;

      /* 실행 기록 */
      case 'logtoggle': S.openLogs[id] = !S.openLogs[id]; render(); break;
      case 'logadd': {
        const ta = document.querySelector(`textarea[data-logfor="${id}"]`);
        const memo = ta.value.trim();
        if(!memo){ toast('내용을 입력해 주세요'); break; }
        const row = await db(sb.from('goal_logs').insert({
          user_id:S.user.id, goal_id:id, log_date:TODAY, memo
        }).select().single());
        S.D.logs.unshift(row); render(); break;
      }
      case 'logedit': {
        const l = S.D.logs.find(x=>x.id===id);
        openSheet('실행 기록 수정', `
          <label>기록</label>
          <textarea class="f" id="lv">${esc(l.memo)}</textarea>
          <div class="sheet-f"><button class="btn ghost" data-close>취소</button>
          <button class="btn primary" id="lsave">저장</button></div>`, el=>{
          el.querySelector('#lsave').onclick = async ()=>{
            const memo = el.querySelector('#lv').value.trim();
            await db(sb.from('goal_logs').update({memo}).eq('id',l.id));
            l.memo = memo; closeSheet(); render();
          };
        });
        break;
      }
      case 'logdel': {
        if(!confirm('이 기록을 삭제할까요?')) break;
        await db(sb.from('goal_logs').delete().eq('id',id));
        S.D.logs = S.D.logs.filter(x=>x.id!==id); render(); break;
      }

      /* 리뷰 */
      case 'seg': S.reviewSeg = t.dataset.v; render(); break;
      case 'day': S.selDay = (S.selDay===t.dataset.d ? null : t.dataset.d); render(); break;
    }
  }catch(err){ console.error(err); }
});

$('#tabbar').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  S.tab = b.dataset.tab; render();
});

/* 프로필 메뉴 */
$('#meBtn').addEventListener('click', e=>{
  e.stopPropagation();
  if(document.querySelector('.menu')) { document.querySelector('.menu').remove(); return; }
  const m = document.createElement('div');
  m.className='menu';
  m.innerHTML = `<div class="em">${esc(S.user.email||'')}</div><button id="logout">로그아웃</button>`;
  document.body.appendChild(m);
  m.querySelector('#logout').onclick = async ()=>{ await sb.auth.signOut(); location.reload(); };
  setTimeout(()=>document.addEventListener('click', function h(){ m.remove(); document.removeEventListener('click',h); }, {once:true}), 0);
});

/* textarea 자동 높이 */
document.addEventListener('input', e=>{
  if(e.target.matches('.loginput textarea')){
    e.target.style.height='auto';
    e.target.style.height = Math.min(120, e.target.scrollHeight)+'px';
  }
});

/* ============================================================
   부팅
   ============================================================ */
function renderMe(){
  const u = S.user, meta = u.user_metadata||{};
  const name = meta.full_name || meta.name || (u.email||'').split('@')[0];
  const pic  = meta.avatar_url || meta.picture;
  $('#meBtn').innerHTML = (pic
      ? `<img src="${esc(pic)}" alt="" referrerpolicy="no-referrer">`
      : `<span class="av">${esc(name.slice(0,1).toUpperCase())}</span>`)
    + `<span>${esc(name)}</span>`;
}

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    $('#splash').classList.add('hidden');
    $('#login').classList.remove('hidden');
    initGoogleButton();
    return;
  }
  S.user = session.user;
  $('#login').classList.add('hidden');
  renderMe();
  await loadAll();
  $('#app').classList.add('on');
  $('#splash').classList.add('hidden');
  render();
}

sb.auth.onAuthStateChange((evt)=>{ if(evt==='SIGNED_OUT') location.reload(); });
boot();

/* Service Worker */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
