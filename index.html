<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#17437d"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="목표 트래커"/>
<link rel="manifest" href="/manifest.json"/>
<title>목표 트래커</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --brand:#17437d;--brand-light:#c3d9f3;--brand-mid:#3a6fa8;
  --surface:#fff;--surface2:#f8f8f7;--surface3:#f2f3f5;
  --border:#e8e7e3;--border2:#d4d2ce;
  --text:#2d2926;--text2:#717170;--text3:#aaa9a7;
  --radius:12px;--radius-sm:8px;
  --shadow-sm:0 2px 8px rgba(0,0,0,.09);--shadow-md:0 4px 16px rgba(0,0,0,.11);
}
body{font-family:'Inter',sans-serif;background:var(--surface2);color:var(--text);max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;font-size:14px;-webkit-font-smoothing:antialiased;}

/* AUTH */
.auth-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:linear-gradient(160deg,#f0f6ff 0%,#f8f8f7 60%);}
.auth-logo{width:60px;height:60px;background:var(--brand);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;box-shadow:0 4px 20px rgba(23,67,125,.3);}
.auth-logo svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.auth-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:.25rem;}
.auth-sub{font-size:13px;color:var(--text3);text-align:center;margin-bottom:1.75rem;}
.auth-card{background:#fff;border-radius:20px;padding:1.5rem;width:100%;max-width:340px;box-shadow:var(--shadow-md);}
.auth-tabs{display:flex;background:var(--surface3);border-radius:var(--radius-sm);padding:3px;margin-bottom:1.25rem;}
.auth-tab{flex:1;padding:.45rem;border:none;background:transparent;border-radius:6px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:.15s;}
.auth-tab.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.1);}
.finput{width:100%;padding:.65rem .875rem;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:14px;color:var(--text);background:#fff;outline:none;transition:.15s;display:block;}
.finput:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(23,67,125,.1);}
.finput+.finput,.flabel+.finput,.finput+.flabel{margin-top:.625rem;}
textarea.finput{resize:none;line-height:1.5;min-height:68px;}
.btn-primary{width:100%;padding:.75rem;background:var(--brand);color:#fff;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;margin-top:.875rem;}
.btn-primary:hover{background:var(--brand-mid);}
.btn-primary:active{transform:scale(.98);}
.auth-err{font-size:12px;color:#e24b4a;min-height:1.25rem;margin-bottom:.25rem;display:none;word-break:keep-all;line-height:1.5;}
.auth-err.show{display:block;}
.btn-primary:disabled{background:var(--text3);cursor:not-allowed;}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh;}
.header{display:flex;align-items:center;justify-content:space-between;padding:.875rem 1rem;background:var(--brand);color:#fff;position:sticky;top:0;z-index:50;}
.header-title{font-size:16px;font-weight:700;}
.user-btn{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:.5rem;padding:.25rem .5rem;border-radius:99px;color:#fff;font-size:13px;font-weight:500;position:relative;}
.user-avatar{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.user-menu{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-md);min-width:170px;overflow:hidden;display:none;z-index:100;}
.user-menu.open{display:block;}
.user-email-sm{padding:.625rem 1rem;font-size:11px;color:var(--text3);border-bottom:1px solid var(--border);}
.umenu-item{display:flex;align-items:center;gap:.5rem;width:100%;padding:.7rem 1rem;border:none;background:none;font-family:inherit;font-size:13px;color:var(--text);cursor:pointer;text-align:left;}
.umenu-item:hover{background:var(--surface3);}
.umenu-item.red{color:#e24b4a;}
.umenu-item svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* NAV */
.nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:53px;z-index:40;}
.nav-btn{flex:1;padding:.7rem .25rem .55rem;border:none;background:none;font-family:inherit;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;}
.nav-btn.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600;}

/* PAGES */
.pages{flex:1;}
.page{display:none;padding:1rem;}
.page.on{display:block;animation:fadeUp .18s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.pg-title{font-size:18px;font-weight:700;margin-bottom:.2rem;}
.pg-sub{font-size:12px;color:var(--text3);margin-bottom:.75rem;}
.accent-bar{height:3px;background:linear-gradient(90deg,#8CC0EB,#9ECAD6,#A7C1A8,#EBD6FB,#FFE99A);border-radius:99px;margin-bottom:1rem;}

/* YEAR */
.ymemo{display:flex;align-items:flex-start;gap:.625rem;padding:.875rem;background:#fff;border-radius:var(--radius);margin-bottom:.5rem;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.ydot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:.15s;}
.ydot.done{background:var(--brand);border-color:var(--brand);}

/* MONTH SEL */
.month-sel{display:flex;gap:.375rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:.75rem;-ms-overflow-style:none;scrollbar-width:none;}
.month-sel::-webkit-scrollbar{display:none;}
.mbtn{padding:.375rem .75rem;border-radius:99px;border:1.5px solid var(--border);background:#fff;font-family:inherit;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;transition:.15s;}
.mbtn.on{background:var(--brand);color:#fff;border-color:var(--brand);}

/* GOAL CARDS */
.goal-card{border-radius:var(--radius);margin-bottom:.625rem;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.goal-hd{display:flex;align-items:center;gap:.5rem;padding:.75rem .875rem;cursor:pointer;}
.goal-name{flex:1;font-size:14px;font-weight:600;}
.goal-body{padding:.625rem .875rem .875rem;background:#fff;}
.pill{display:inline-flex;align-items:center;padding:.2rem .55rem;border-radius:99px;font-size:10px;font-weight:600;}
.pill-r{background:#e8f3fb;color:#2b6cb0;}
.pill-p{background:#f0ebfd;color:#6b46c1;}
.iBtn{background:none;border:none;cursor:pointer;padding:.25rem;border-radius:6px;color:var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.iBtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}
.iBtn:hover{background:rgba(0,0,0,.06);}
.prog-bar{height:5px;background:var(--surface3);border-radius:99px;overflow:hidden;margin:.375rem 0;}
.prog-fill{height:100%;border-radius:99px;transition:.3s;}
.week-row{display:flex;align-items:flex-start;gap:.5rem;padding:.5rem 0;border-bottom:1px solid var(--border);}
.week-row:last-of-type{border-bottom:none;}
.wdot{width:8px;height:8px;border-radius:50%;background:var(--border2);margin-top:5px;flex-shrink:0;}
.wdot.done{background:#27ae60;}
.add-week-btn{width:100%;margin-top:.5rem;padding:.5rem;border:1.5px dashed var(--border2);background:none;border-radius:var(--radius-sm);font-family:inherit;font-size:12px;color:var(--text3);cursor:pointer;}
.add-week-btn:hover{background:var(--surface3);}
.banner{background:#f0faf4;border-radius:var(--radius-sm);padding:.5rem .75rem;font-size:12px;color:#27ae60;margin-bottom:.5rem;display:flex;align-items:center;gap:.375rem;}

/* CHECK */
.chk-date{font-size:13px;color:var(--text2);margin-bottom:.2rem;display:flex;align-items:center;gap:.375rem;}
.week-ctx{font-size:11px;color:var(--text3);margin-bottom:.875rem;}
.chk-card{display:flex;align-items:center;gap:.75rem;padding:.875rem;background:#fff;border-radius:var(--radius);margin-bottom:.5rem;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.chk-circle{width:28px;height:28px;border-radius:50%;border:2px solid var(--border2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s;}
.chk-info{flex:1;min-width:0;}
.chk-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chk-meta{font-size:11px;color:var(--text3);margin-top:2px;}
.memo-btn{font-size:11px;color:var(--brand);background:none;border:none;cursor:pointer;padding:.25rem .5rem;border-radius:6px;font-family:inherit;flex-shrink:0;}
.memo-area{background:var(--surface3);border-radius:var(--radius-sm);padding:.625rem .875rem;margin-bottom:.5rem;margin-top:-0.25rem;}
.memo-input{width:100%;background:none;border:none;font-family:inherit;font-size:13px;color:var(--text);resize:none;outline:none;}
.memo-save{font-size:12px;color:var(--brand);background:none;border:none;cursor:pointer;font-family:inherit;margin-top:.375rem;}

/* REVIEW */
.rv-tabs{display:flex;background:var(--surface3);border-radius:var(--radius-sm);padding:3px;margin-bottom:1rem;}
.rv-tab{flex:1;padding:.45rem;border:none;background:transparent;border-radius:6px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:.15s;}
.rv-tab.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.1);}
.wk-row{display:grid;grid-template-columns:38px 1fr;gap:.5rem;margin-bottom:.5rem;align-items:start;}
.wk-label{font-size:10px;color:var(--text3);font-weight:600;text-align:right;padding-top:.3rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wk-bar{background:#fff;border-radius:var(--radius-sm);padding:.625rem .75rem;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.wk-bar-name{font-size:12px;font-weight:500;margin-bottom:.375rem;}
.dots-row{display:flex;flex-wrap:wrap;gap:4px;}
.dot-day{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border2);font-size:8px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--text3);}
.dot-day.chk{border-color:transparent;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;}
.cal-nav{background:none;border:none;cursor:pointer;padding:.25rem .5rem;font-size:18px;color:var(--text2);border-radius:6px;}
.cal-nav:hover{background:var(--surface3);}
.cal-title{font-size:14px;font-weight:600;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-dh{font-size:10px;font-weight:600;color:var(--text3);text-align:center;padding:.25rem 0;}
.cal-day{aspect-ratio:1;border-radius:8px;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:none;background:none;font-family:inherit;color:var(--text);}
.cal-day.today{background:var(--brand-light);color:var(--brand);font-weight:700;}
.cal-day.sel{background:var(--brand);color:#fff;}
.cal-day.has-dot::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--brand);margin-top:1px;}
.cal-day.sel.has-dot::after{background:#fff;}
.cal-empty{aspect-ratio:1;}
.cal-detail{background:#fff;border-radius:var(--radius);padding:.875rem;margin-top:.75rem;box-shadow:0 1px 4px rgba(0,0,0,.08);}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(45,41,38,.45);display:none;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(3px);}
.modal-backdrop.open{display:flex;}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:1.5rem 1rem 2.5rem;width:100%;max-width:420px;max-height:92vh;overflow-y:auto;box-shadow:0 -6px 32px rgba(0,0,0,.15);}
.modal::before{content:'';display:block;height:4px;background:linear-gradient(90deg,#8CC0EB,#9ECAD6,#A7C1A8,#EBD6FB,#FFE99A);margin:-1.5rem -1rem 1.25rem;}
.modal h2{font-size:17px;font-weight:700;margin-bottom:.25rem;}
.modal-desc{font-size:12px;color:var(--text3);margin-bottom:.75rem;}
.flabel{display:block;font-size:12px;font-weight:600;color:var(--text2);margin:.875rem 0 .375rem;}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.25rem;}
.opt{padding:.625rem .5rem;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-family:inherit;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;text-align:center;transition:.15s;background:#fff;}
.opt.sel{border-color:var(--brand);color:var(--brand);background:#f0f6ff;}
.opt-big{padding:.75rem .5rem;line-height:1.4;}
.count-row{display:flex;align-items:center;justify-content:center;gap:.75rem;padding:.625rem 0;}
.cnt-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);}
.cnt-num{font-size:18px;font-weight:700;color:var(--text);min-width:32px;text-align:center;}
.color-palette{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.375rem;}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:.15s;}
.color-swatch.sel{border-color:#2d2926;transform:scale(1.15);}
.divider{border:none;border-top:1px solid var(--border);margin:1rem -1rem;}
.info-box{background:var(--surface3);border-radius:var(--radius-sm);padding:.625rem .75rem;font-size:12px;color:var(--text2);margin-top:.75rem;}
.ccancel{display:block;text-align:center;margin-top:.75rem;font-size:13px;color:var(--text3);cursor:pointer;}
.ccancel:hover{color:var(--text);}

/* FAB */
.fab{position:fixed;bottom:1.5rem;right:calc(50% - 210px + 1.25rem);width:52px;height:52px;border-radius:50%;background:var(--brand);color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(23,67,125,.35);display:flex;align-items:center;justify-content:center;z-index:30;transition:.15s;line-height:1;}
.fab:active{transform:scale(.92);}
@media(max-width:440px){.fab{right:1.25rem;}}
.empty-msg{padding:1.5rem;text-align:center;color:var(--text3);font-size:13px;line-height:1.6;}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen" class="auth-wrap">
  <div class="auth-logo">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
  </div>
  <div class="auth-title">목표 트래커</div>
  <div class="auth-sub">나만의 목표를 체계적으로 관리하세요</div>
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab on" onclick="switchTab('login',this)">로그인</button>
      <button class="auth-tab" onclick="switchTab('signup',this)">회원가입</button>
    </div>
    <div class="auth-err" id="auth-err"></div>
    <input class="finput" id="a-email" type="email" placeholder="이메일" autocomplete="email"/>
    <input class="finput" id="a-pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password"/>
    <input class="finput" id="a-pw2" type="password" placeholder="비밀번호 확인" autocomplete="new-password" style="display:none"/>
    <button class="btn-primary" id="auth-btn" onclick="doAuth()">로그인</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="header-title">목표 트래커</div>
    <div style="position:relative">
      <button class="user-btn" onclick="toggleMenu(event)">
        <div class="user-avatar" id="user-avatar">?</div>
        <span id="user-name"></span>
      </button>
      <div class="user-menu" id="user-menu">
        <div class="user-email-sm" id="user-email"></div>
        <button class="umenu-item red" onclick="doSignOut()">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          로그아웃
        </button>
      </div>
    </div>
  </div>

  <nav class="nav">
    <button class="nav-btn" onclick="goPage('year',this)">연간</button>
    <button class="nav-btn" onclick="goPage('monthly',this)">월간설정</button>
    <button class="nav-btn on" onclick="goPage('check',this)">오늘체크</button>
    <button class="nav-btn" onclick="goPage('review',this)">리뷰</button>
  </nav>

  <div class="pages">
    <div class="page" id="pg-year">
      <div class="pg-title">연간 목표</div>
      <div class="pg-sub">큰 그림을 그려두세요</div>
      <div class="accent-bar"></div>
      <div id="year-list"></div>
    </div>

    <div class="page" id="pg-monthly">
      <div class="pg-title">월간 설정</div>
      <div class="pg-sub">월별로 독립적인 목표를 설정하세요</div>
      <div class="accent-bar"></div>
      <div class="month-sel" id="month-sel"></div>
      <div id="monthly-content"></div>
    </div>

    <div class="page on" id="pg-check">
      <div class="pg-title">오늘 체크</div>
      <div class="chk-date" id="chk-date-label"></div>
      <div class="week-ctx" id="week-ctx"></div>
      <div id="check-list"></div>
    </div>

    <div class="page" id="pg-review">
      <div class="pg-title">리뷰</div>
      <div class="pg-sub" id="rv-sub"></div>
      <div class="accent-bar"></div>
      <div class="rv-tabs">
        <button class="rv-tab on" onclick="switchRv('weekly',this)">주간 현황</button>
        <button class="rv-tab" onclick="switchRv('monthly',this)">월간 요약</button>
      </div>
      <div id="rv-content"></div>
    </div>
  </div>
</div>

<button class="fab" id="fab" onclick="openFab()" style="display:none">+</button>

<div class="modal-backdrop" id="modal" onclick="onBackdropClick(event)">
  <div class="modal" id="modal-inner"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── SUPABASE ──
const SUPA_URL = 'https://fiikawlccmydcafjylnm.supabase.co';
const SUPA_KEY = 'sb_publishable_27pcngDMpXY5VuUwIu995w_H87iYXhC';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY, {
  auth: {
    persistSession: true,
    storageKey: 'gt-auth-v2',
    storage: window.localStorage,
    autoRefreshToken: true,
    detectSessionInUrl: false
  }
});

let currentUser = null;
let curPage = 'check';

// ── AUTH ──
let authMode = 'login';
function switchTab(mode, el) {
  authMode = mode;
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('a-pw2').style.display = mode === 'signup' ? '' : 'none';
  document.getElementById('auth-btn').textContent = mode === 'signup' ? '회원가입' : '로그인';
  setAuthErr('');
}
function setAuthErr(msg) {
  const el = document.getElementById('auth-err');
  el.textContent = msg;
  el.className = msg ? 'auth-err show' : 'auth-err';
}
function resetBtn() {
  const btn = document.getElementById('auth-btn');
  btn.disabled = false;
  btn.textContent = authMode === 'signup' ? '회원가입' : '로그인';
}
async function doAuth() {
  const email = document.getElementById('a-email').value.trim();
  const pw = document.getElementById('a-pw').value;
  if (!email || !pw) { setAuthErr('이메일과 비밀번호를 입력하세요.'); return; }
  document.getElementById('auth-btn').disabled = true;
  document.getElementById('auth-btn').textContent = '처리 중...';
  if (authMode === 'signup') {
    const pw2 = document.getElementById('a-pw2').value;
    if (pw.length < 6) { setAuthErr('비밀번호는 6자 이상이어야 합니다.'); resetBtn(); return; }
    if (pw !== pw2) { setAuthErr('비밀번호가 일치하지 않습니다.'); resetBtn(); return; }
    const { data, error } = await sb.auth.signUp({ email, password: pw });
    if (error) { setAuthErr('[Supabase 오류] ' + error.message); resetBtn(); return; }
    if (data.user && !data.session) {

const COLORS = ['#BFDDF0','#8CC0EB','#9ECAD6','#A7C1A8','#FBC3C1','#FFA4A4','#EBD6FB','#E5D9F2','#FFF9D2','#FFE99A'];

function fmt(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function wkBounds(s) {
  const dt = new Date(s), day = dt.getDay(), diff = day === 0 ? -6 : 1 - day;
  const m = new Date(dt); m.setDate(dt.getDate() + diff);
  const e = new Date(m); e.setDate(m.getDate() + 6);
  return [fmt(m), fmt(e)];
}
function moBounds(y, m) { return [y+'-'+String(m+1).padStart(2,'0')+'-01', fmt(new Date(y, m+1, 0))]; }
function datesIn(s, e) {
  const r = [], c = new Date(s), end = new Date(e);
  while (c <= end) { r.push(fmt(c)); c.setDate(c.getDate()+1); }
  return r;
}
function darkColor(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) > 190 ? '#2d2926' : '#fff';
}
const [WS, WE] = wkBounds(TODAY);
function getMonthWeeks(mk) {
  const [y, m] = mk.split('-').map(Number);
  const [ms, me] = moBounds(y, m-1);
  const weeks = [], seen = new Set();
  let cur = new Date(ms);
  while (fmt(cur) <= me) {
    const [ws, we] = wkBounds(fmt(cur));
    if (!seen.has(ws)) {
      seen.add(ws);
      weeks.push({ key: ws, start: ws < ms ? ms : ws, end: we > me ? me : we });
    }
    cur.setDate(cur.getDate() + 7);
  }
  return weeks;
}
function curWkIdx(mk) { return getMonthWeeks(mk).findIndex(w => TODAY >= w.start && TODAY <= w.end); }

async function loadAllData() {
  if (!currentUser) return;
  const uid = currentUser.id;
  const [r1, r2, r3, r4, r5] = await Promise.all([
    sb.from('year_goals').select('*').eq('user_id', uid).order('created_at'),
    sb.from('monthly_goals').select('*').eq('user_id', uid).order('sort_order'),
    sb.from('weekly_goals').select('*').eq('user_id', uid).order('sort_order'),
    sb.from('goal_checks').select('*').eq('user_id', uid),
    sb.from('goal_logs').select('*').eq('user_id', uid).order('created_at', { ascending: false })
  ]);
  if (r1.error?.status === 401 || r2.error?.status === 401) { doSignOut(); return; }
  const yg = r1.data || [], mg = r2.data || [], wg = r3.data || [], chk = r4.data || [], logs = r5.data || [];
  yearGoals = yg.map(r => ({ id: r.id, text: r.text, note: r.note || '', done: r.done }));
  monthlyData = {};
  mg.forEach(m => {
    if (!monthlyData[m.month_key]) monthlyData[m.month_key] = [];
    const weeks = wg.filter(w => w.monthly_goal_id === m.id).map(w => {
      const wc = {}; chk.filter(c => c.goal_id === w.id && c.goal_type === 'weekly').forEach(c => wc[c.checked_date] = 'done');
      const wl = logs.filter(l => l.goal_id === w.id).map(l => ({ date: l.log_date, memo: l.memo }));
      return { id: w.id, name: w.name, note: w.note || '', checks: wc, logs: wl };
    });
    const mc = {}; chk.filter(c => c.goal_id === m.id && c.goal_type === 'repeat').forEach(c => mc[c.checked_date] = 'done');
    const ml = logs.filter(l => l.goal_id === m.id).map(l => ({ date: l.log_date, memo: l.memo }));
    monthlyData[m.month_key].push({ id: m.id, name: m.name, goalType: m.goal_type, logType: m.log_type, color: m.color, repeatUnit: m.repeat_unit, repeatCount: m.repeat_count, collapsed: m.collapsed || false, checks: mc, logs: ml, weeks });
  });
}

async function saveCheck(gid, gtype, date, on) {

  else await sb.from('goal_checks').delete().eq('user_id', currentUser.id).eq('goal_id', gid).eq('checked_date', date);

async function saveLog(gid, date, memo) {

async function toggleYear(id) {

async function toggleRpt(mgId) {
  const mg = getMg(CMK, mgId); if (!mg) return;
  const was = !!mg.checks[TODAY];
  if (was) delete mg.checks[TODAY]; else mg.checks[TODAY] = 'done';
  await saveCheck(mgId, 'repeat', TODAY, !was);
  renderCheck();
}
async function toggleWk(mgId, wId) {
  const mg = getMg(CMK, mgId); if (!mg) return;
  const w = (mg.weeks || []).find(x => x.id === wId); if (!w) return;
  const was = !!w.checks[TODAY];
  if (was) delete w.checks[TODAY]; else w.checks[TODAY] = 'done';
  await saveCheck(wId, 'weekly', TODAY, !was);
  renderCheck();
}
function toggleMemo(id) {
  const el = document.getElementById('memo-' + id);
  if (el) el.style.display = el.style.display === 'none' ? '' : 'none';
}
async function saveMemoRpt(mgId) {
  const mg = getMg(CMK, mgId); if (!mg) return;
  const ta = document.querySelector('#memo-' + mgId + ' .memo-input');
  const memo = ta ? ta.value.trim() : '';
  const idx = (mg.logs || []).findIndex(l => l.date === TODAY);
  if (!mg.logs) mg.logs = [];
  if (idx >= 0) { if (memo) mg.logs[idx].memo = memo; else mg.logs.splice(idx, 1); }
  else if (memo) mg.logs.push({ date: TODAY, memo });
  await saveLog(mgId, TODAY, memo);
  document.getElementById('memo-' + mgId).style.display = 'none';
}
async function saveMemoWk(mgId, wId) {
  const mg = getMg(CMK, mgId); if (!mg) return;
  const w = (mg.weeks || []).find(x => x.id === wId); if (!w) return;
  const ta = document.querySelector('#memo-' + wId + ' .memo-input');
  const memo = ta ? ta.value.trim() : '';
  if (!w.logs) w.logs = [];
  const idx = w.logs.findIndex(l => l.date === TODAY);
  if (idx >= 0) { if (memo) w.logs[idx].memo = memo; else w.logs.splice(idx, 1); }
  else if (memo) w.logs.push({ date: TODAY, memo });
  await saveLog(wId, TODAY, memo);
  document.getElementById('memo-' + wId).style.display = 'none';
}

function renderMonthCal() {
  const mk = calYear + '-' + String(calMonth+1).padStart(2,'0');
  const [ms, me] = moBounds(calYear, calMonth);
  const days = datesIn(ms, me);
  const goals = monthlyData[mk] || [];
  const active = new Set();
  goals.forEach(mg => {
    Object.keys(mg.checks || {}).forEach(d => active.add(d));
    (mg.logs || []).forEach(l => active.add(l.date));
    (mg.weeks || []).forEach(w => {
      Object.keys(w.checks || {}).forEach(d => active.add(d));
      (w.logs || []).forEach(l => active.add(l.date));
    });
  });
  const firstDay = new Date(ms).getDay();
  const offset = firstDay === 0 ? 6 : firstDay - 1;
  let cal = '<div class="cal-header">' +
    '<button class="cal-nav" onclick="calNav(-1)">&#8249;</button>' +
    '<div class="cal-title">' + calYear + '년 ' + (calMonth+1) + '월</div>' +
    '<button class="cal-nav" onclick="calNav(1)">&#8250;</button>' +
    '</div><div class="cal-grid">' +
    ['월','화','수','목','금','토','일'].map(d => '<div class="cal-dh">' + d + '</div>').join('') +
    Array(offset).fill('<div class="cal-empty"></div>').join('') +
    days.map(d => {
      const dn = parseInt(d.slice(8));
      const cls = 'cal-day' + (d === TODAY ? ' today' : '') + (d === calSelDate ? ' sel' : '') + (active.has(d) ? ' has-dot' : '');
      return '<button class="' + cls + '" onclick="selCalDay(\'' + d + '\')">' + dn + '</button>';
    }).join('') + '</div>';
  let detail = '';
  if (calSelDate) {
    const items = [];
    goals.forEach(mg => {
      if (mg.goalType === 'repeat' && mg.checks[calSelDate]) {
        const log = (mg.logs || []).find(l => l.date === calSelDate);
        items.push('<div style="margin-bottom:.5rem"><div style="font-size:13px;font-weight:500">✓ ' + mg.name + '</div>' + (log ? '<div style="font-size:12px;color:var(--text2);margin-top:2px">' + log.memo + '</div>' : '') + '</div>');
      }
      (mg.weeks || []).forEach(w => {
        if (w.checks[calSelDate]) {
          const log = (w.logs || []).find(l => l.date === calSelDate);
          items.push('<div style="margin-bottom:.5rem"><div style="font-size:13px;font-weight:500">✓ ' + mg.name + ' › ' + w.name + '</div>' + (log ? '<div style="font-size:12px;color:var(--text2);margin-top:2px">' + log.memo + '</div>' : '') + '</div>');
        }
      });
    });
    if (items.length) {
      detail = '<div class="cal-detail"><div style="font-size:12px;font-weight:600;color:var(--text3);margin-bottom:.625rem">' + calSelDate.slice(5).replace('-', '/') + '</div>' + items.join('') + '</div>';
    }
  }
  document.getElementById('rv-content').innerHTML = cal + detail;
}

async function sbCall(promise) {
  const timeout = new Promise(resolve =>
    setTimeout(() => resolve({ data: null, error: { message: '네트워크 응답 없음. 인터넷 연결을 확인해주세요.', code: 'TIMEOUT' } }), 15000)
  );
  const result = await Promise.race([promise, timeout]);
  if (result?.error) {
    const err = result.error;
    if (err.code === 'TIMEOUT') return result;
    const msg = (err.message || '').toLowerCase();
    const isAuthErr = err.status === 401 || msg.includes('jwt expired') ||
      msg.includes('invalid token') || msg.includes('token is expired') ||
      msg.includes('refresh_token_not_found') || err.code === 'PGRST301';
    if (isAuthErr) setTimeout(doSignOut, 1500);
  }
  return result;
}

      w.note = document.getElementById('mi-wnote')?.value.trim() || '';
      const { error } = await sbCall(sb.from('weekly_goals').update({ name: w.name, note: w.note }).eq('id', p2));
      if (error) { showModalErr('저장 실패: ' + error.message); setSaveBtn(false); return; }
      closeModal(); await loadAllData(); renderMonthly();
    }
  } catch (e) { showModalErr('오류: ' + e.message); setSaveBtn(false); }
}

// ── NAV ──
function goPage(p, el) {
  curPage = p;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  document.querySelectorAll('.page').forEach(pg => pg.classList.remove('on'));
  document.getElementById('pg-' + p).classList.add('on');
  updateFab();
  if (p === 'year') renderYear();
  else if (p === 'monthly') {
    const latest = MONTHS.slice().reverse().find(m => (monthlyData[m] || []).length);
    selMonth = latest || CMK;
    renderMonthly();
  }
  else if (p === 'check') renderCheck();
  else if (p === 'review') renderReview();
}
function updateFab() {
  document.getElementById('fab').style.display = (curPage === 'year' || curPage === 'monthly') && currentUser ? '' : 'none';
}

// ── SW ──
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
