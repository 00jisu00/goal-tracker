<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#17437d"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="오늘 목표"/>
<title>오늘 목표</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --brand:#17437d;--brand-light:#c3d9f3;
  --surface:#fff;--surface2:#f8f8f7;--surface3:#f2f3f5;
  --border:#e8e7e3;--text:#2d2926;--text2:#717170;--text3:#aaa9a7;
  --radius:14px;--radius-sm:9px;
}
body{font-family:'Inter',sans-serif;background:var(--surface2);color:var(--text);max-width:420px;margin:0 auto;min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;}

/* AUTH */
.auth-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:linear-gradient(160deg,#f0f6ff,#f8f8f7);}
.auth-logo{width:56px;height:56px;background:var(--brand);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto .875rem;box-shadow:0 4px 16px rgba(23,67,125,.28);}
.auth-logo svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.auth-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:.25rem;}
.auth-card{background:#fff;border-radius:18px;padding:1.375rem;width:100%;max-width:320px;box-shadow:0 4px 16px rgba(0,0,0,.1);margin-top:1.5rem;}
.finput{width:100%;padding:.65rem .875rem;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:14px;color:var(--text);background:#fff;outline:none;transition:.15s;display:block;}
.finput:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(23,67,125,.1);}
.finput+.finput{margin-top:.625rem;}
.btn-login{width:100%;padding:.75rem;background:var(--brand);color:#fff;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:.875rem;}
.btn-login:active{transform:scale(.98);}
.auth-err{font-size:12px;color:#e24b4a;min-height:1rem;margin-top:.375rem;display:none;}
.auth-err.show{display:block;}
.auth-link{font-size:12px;color:var(--text3);text-align:center;margin-top:.875rem;}
.auth-link a{color:var(--brand);text-decoration:none;}

/* HEADER */
.top{background:var(--brand);padding:.875rem 1rem .75rem;color:#fff;display:flex;align-items:center;justify-content:space-between;}
.top-date{font-size:13px;opacity:.85;}
.top-title{font-size:16px;font-weight:700;}
.top-prog{font-size:13px;font-weight:600;opacity:.9;}

/* PROGRESS BAR */
.prog-wrap{background:var(--brand);padding:0 1rem .875rem;}
.prog-track{height:6px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:#fff;border-radius:99px;transition:.4s;}
.prog-label{font-size:11px;color:rgba(255,255,255,.7);margin-top:.375rem;}

/* LIST */
.list{padding:.875rem .875rem 6rem;}
.section-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:.5rem 0 .5rem .25rem;}

/* GOAL ITEM */
.goal-item{background:#fff;border-radius:var(--radius);margin-bottom:.625rem;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.goal-main{display:flex;align-items:center;gap:.75rem;padding:.875rem;}
.circle{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s;-webkit-tap-highlight-color:transparent;}
.circle.done{border-color:transparent;}
.circle svg{display:none;}
.circle.done svg{display:block;}
.goal-text{flex:1;min-width:0;}
.goal-name{font-size:15px;font-weight:500;line-height:1.35;}
.goal-name.done{text-decoration:line-through;color:var(--text3);}
.goal-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.memo-toggle{font-size:11px;color:var(--brand);background:none;border:none;cursor:pointer;padding:.25rem .5rem;font-family:inherit;flex-shrink:0;}
.memo-box{padding:.625rem .875rem .75rem;background:var(--surface3);border-top:1px solid var(--border);}
.memo-input{width:100%;background:none;border:none;font-family:inherit;font-size:13px;color:var(--text);resize:none;outline:none;line-height:1.5;}
.memo-save{display:inline-block;margin-top:.375rem;font-size:12px;color:var(--brand);background:none;border:none;cursor:pointer;font-family:inherit;font-weight:500;}

/* EMPTY */
.empty{padding:3rem 1.5rem;text-align:center;color:var(--text3);font-size:13px;line-height:1.8;}
.empty svg{width:40px;height:40px;stroke:var(--border);fill:none;stroke-width:1.5;margin-bottom:.75rem;}

/* ALL DONE */
.all-done{margin:1.5rem .875rem;background:#f0faf4;border-radius:var(--radius);padding:1.5rem;text-align:center;}
.all-done-emoji{font-size:36px;margin-bottom:.5rem;}
.all-done-text{font-size:15px;font-weight:600;color:#1a7a45;margin-bottom:.25rem;}
.all-done-sub{font-size:12px;color:#4caf7d;}

/* FOOTER */
.footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#fff;border-top:1px solid var(--border);padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;}
.footer-app{display:flex;align-items:center;gap:.375rem;color:var(--brand);font-size:13px;font-weight:500;text-decoration:none;}
.footer-app svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.footer-out{background:none;border:none;font-family:inherit;font-size:12px;color:var(--text3);cursor:pointer;}
.footer-out:active{color:#e24b4a;}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:.75rem;color:var(--text3);font-size:13px;}
.spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <div>불러오는 중...</div>
</div>

<div id="auth-screen" class="auth-wrap" style="display:none">
  <div class="auth-logo">
    <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
  </div>
  <div class="auth-title">오늘 목표</div>
  <div class="auth-card">
    <div class="auth-err" id="auth-err"></div>
    <input class="finput" id="a-email" type="email" placeholder="이메일" autocomplete="email"/>
    <input class="finput" id="a-pw" type="password" placeholder="비밀번호" autocomplete="current-password"/>
    <button class="btn-login" onclick="doLogin()">로그인</button>
  </div>
  <div class="auth-link">목표 설정은 <a href="/">전체 앱</a>에서</div>
</div>

<div id="app" style="display:none">
  <div class="top">
    <div>
      <div class="top-date" id="top-date"></div>
      <div class="top-title">오늘 목표</div>
    </div>
    <div class="top-prog" id="top-prog"></div>
  </div>
  <div class="prog-wrap">
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="prog-label" id="prog-label"></div>
  </div>
  <div class="list" id="goal-list"></div>
</div>

<div class="footer" id="footer" style="display:none">
  <a class="footer-app" href="/">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    전체 앱 열기
  </a>
  <button class="footer-out" onclick="doSignOut()">로그아웃</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://fiikawlccmydcafjylnm.supabase.co';
const SUPA_KEY = 'sb_publishable_27pcngDMpXY5VuUwIu995w_H87iYXhC';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY, {
  auth: { persistSession: true, storageKey: 'gt-auth-v2', storage: window.localStorage, autoRefreshToken: true, detectSessionInUrl: false }
});

const _N = new Date();
const TODAY = fmt(_N);
const DAYKR = ['일','월','화','수','목','금','토'];
const CMK = _N.getFullYear() + '-' + String(_N.getMonth()+1).padStart(2,'0');

function fmt(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function wkBounds(s) {
  const dt = new Date(s), day = dt.getDay(), diff = day === 0 ? -6 : 1 - day;
  const m = new Date(dt); m.setDate(dt.getDate() + diff);
  const e = new Date(m); e.setDate(m.getDate() + 6);
  return [fmt(m), fmt(e)];
}
function moBounds(y, m) { return [y+'-'+String(m+1).padStart(2,'0')+'-01', fmt(new Date(y,m+1,0))]; }
function darkColor(hex) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b)>190?'#2d2926':'#fff';
}
function getMonthWeeks(mk) {
  const [y,m]=mk.split('-').map(Number);
  const [ms,me]=moBounds(y,m-1);
  const weeks=[],seen=new Set();let cur=new Date(ms);
  while(fmt(cur)<=me){const[ws,we]=wkBounds(fmt(cur));if(!seen.has(ws)){seen.add(ws);weeks.push({start:ws<ms?ms:ws,end:we>me?me:we});}cur.setDate(cur.getDate()+7);}
  return weeks;
}
function curWkIdx() { return getMonthWeeks(CMK).findIndex(w=>TODAY>=w.start&&TODAY<=w.end); }

document.getElementById('top-date').textContent = (_N.getMonth()+1)+'월 '+_N.getDate()+'일 ('+DAYKR[_N.getDay()]+')';

// ── AUTH ──
function setErr(msg) { const el=document.getElementById('auth-err'); el.textContent=msg; el.className=msg?'auth-err show':'auth-err'; }
async function doLogin() {
  const email=document.getElementById('a-email').value.trim();
  const pw=document.getElementById('a-pw').value;
  if(!email||!pw){setErr('이메일과 비밀번호를 입력하세요.');return;}
  const{error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){setErr('이메일 또는 비밀번호가 올바르지 않습니다.');}
}
document.getElementById('a-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
async function doSignOut(){await sb.auth.signOut();}

// ── DATA ──
let goals=[];

async function loadGoals(uid) {
  const cwi = curWkIdx();
  const [r1,r2,r3,r4,r5] = await Promise.all([
    sb.from('monthly_goals').select('*').eq('user_id',uid).eq('month_key',CMK).order('sort_order'),
    sb.from('weekly_goals').select('*').eq('user_id',uid).order('sort_order'),
    sb.from('goal_checks').select('*').eq('user_id',uid).eq('checked_date',TODAY),
    sb.from('goal_logs').select('*').eq('user_id',uid).eq('log_date',TODAY),
    sb.from('goal_checks').select('*').eq('user_id',uid)
  ]);
  const mg=r1.data||[], wg=r2.data||[], todayChk=r3.data||[], todayLogs=r4.data||[];

  goals=[];
  mg.forEach(m=>{
    if(m.goal_type==='repeat'){
      const chk=todayChk.find(c=>c.goal_id===m.id);
      const log=todayLogs.find(l=>l.goal_id===m.id);
      goals.push({id:m.id,name:m.name,sub:m.repeat_unit==='week'?'주 '+m.repeat_count+'회':'매일',color:m.color,logType:m.log_type,done:!!chk,memo:log?log.memo:'',type:'repeat'});
    } else {
      if(cwi<0)return;
      const ws=wg.filter(w=>w.monthly_goal_id===m.id);
      const w=ws[cwi];
      if(!w)return;
      const chk=todayChk.find(c=>c.goal_id===w.id);
      const log=todayLogs.find(l=>l.goal_id===w.id);
      goals.push({id:w.id,parentId:m.id,name:m.name,sub:(['W1','W2','W3','W4'][cwi]||'W'+(cwi+1))+' · '+w.name,color:m.color,logType:m.log_type,done:!!chk,memo:log?log.memo:'',type:'weekly'});
    }
  });
  render();
}

function render() {
  const total=goals.length, done=goals.filter(g=>g.done).length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('top-prog').textContent=total?done+'/'+total:'';
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-label').textContent=total?pct+'% 완료 · '+done+'/'+total+'개':'오늘 목표가 없어요';

  const list=document.getElementById('goal-list');
  if(!total){
    list.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><div>이번 달 목표가 없어요</div><div style="font-size:12px;margin-top:.5rem"><a href="/" style="color:var(--brand)">전체 앱에서 목표 추가하기</a></div></div>';
    return;
  }
  if(done===total&&total>0){
    list.innerHTML='<div class="all-done"><div class="all-done-emoji">🎉</div><div class="all-done-text">오늘 목표 모두 완료!</div><div class="all-done-sub">정말 수고하셨어요</div></div>'+
      goals.map(g=>itemHtml(g)).join('');
    return;
  }

  const pending=goals.filter(g=>!g.done);
  const completed=goals.filter(g=>g.done);
  let html='';
  if(pending.length) html+=pending.map(g=>itemHtml(g)).join('');
  if(completed.length) html+='<div class="section-label">완료</div>'+completed.map(g=>itemHtml(g)).join('');
  list.innerHTML=html;
}

function itemHtml(g) {
  const col=g.color||'#BFDDF0';
  const dk=darkColor(col);
  const circleBg=g.done?'background:'+col+';border-color:'+col:'border-color:'+col;
  const chkSvg='<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:'+dk+';fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg>';
  return '<div class="goal-item" id="item-'+g.id+'">' +
    '<div class="goal-main">' +
      '<div class="circle'+(g.done?' done':'')+'" style="'+circleBg+'" onclick="toggleGoal(\''+g.id+'\',\''+g.type+'\')">'+chkSvg+'</div>' +
      '<div class="goal-text">' +
        '<div class="goal-name'+(g.done?' done':'')+'">'+g.name+'</div>' +
        '<div class="goal-sub">'+g.sub+'</div>' +
      '</div>' +
      (g.logType==='memo'?'<button class="memo-toggle" onclick="toggleMemo(\''+g.id+'\')">메모</button>':'') +
    '</div>' +
    (g.logType==='memo'?
      '<div class="memo-box" id="memo-'+g.id+'" style="display:none">' +
        '<textarea class="memo-input" rows="2" placeholder="오늘의 기록..." id="ta-'+g.id+'">'+g.memo+'</textarea>' +
        '<button class="memo-save" onclick="saveMemo(\''+g.id+'\')">저장</button>' +
      '</div>' : '') +
    '</div>';
}

async function toggleGoal(id, type) {
  const g=goals.find(x=>x.id===id); if(!g)return;
  g.done=!g.done;
  render();
  if(g.done){
    await sb.from('goal_checks').upsert({user_id:currentUid,goal_id:id,goal_type:type,checked_date:TODAY},{onConflict:'user_id,goal_id,checked_date'});
  } else {
    await sb.from('goal_checks').delete().eq('user_id',currentUid).eq('goal_id',id).eq('checked_date',TODAY);
  }
}

function toggleMemo(id) {
  const el=document.getElementById('memo-'+id);
  if(el) el.style.display=el.style.display==='none'?'':'none';
}
async function saveMemo(id) {
  const g=goals.find(x=>x.id===id); if(!g)return;
  const ta=document.getElementById('ta-'+id);
  const memo=ta?ta.value.trim():'';
  g.memo=memo;
  await sb.from('goal_logs').delete().eq('user_id',currentUid).eq('goal_id',id).eq('log_date',TODAY);
  if(memo) await sb.from('goal_logs').insert({user_id:currentUid,goal_id:id,log_date:TODAY,memo});
  document.getElementById('memo-'+id).style.display='none';
}

// ── INIT ──
let currentUid=null;
sb.auth.onAuthStateChange(async(event,session)=>{
  if(session&&session.user){
    currentUid=session.user.id;
    document.getElementById('loading').style.display='none';
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app').style.display='';
    document.getElementById('footer').style.display='';
    await loadGoals(currentUid);
  } else {
    currentUid=null;
    document.getElementById('loading').style.display='none';
    document.getElementById('auth-screen').style.display='';
    document.getElementById('app').style.display='none';
    document.getElementById('footer').style.display='none';
  }
});
</script>
</body>
</html>
